<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a2a18">
<title>PEAKER · Gửi cậu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--n2,#3a1a10)}
body{min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:#4A3128;background:var(--n2,#3a1a10);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden}
@media (min-height:501px){html,body{height:100%;overflow:hidden}}
#nen{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(110% 75% at 50% 40%,var(--n1,#c8643a) 0,var(--n2,#3a1a10) 78%),var(--n2,#3a1a10)}
#nen::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 18% 22%,rgba(255,240,215,.16) 0 9px,transparent 10px),
             radial-gradient(circle at 84% 16%,rgba(255,240,215,.13) 0 6px,transparent 7px),
             radial-gradient(circle at 78% 82%,rgba(255,240,215,.12) 0 12px,transparent 13px),
             radial-gradient(circle at 12% 74%,rgba(255,240,215,.10) 0 7px,transparent 8px)}
.motes{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.motes i{position:absolute;bottom:-12px;border-radius:50%;opacity:0;will-change:transform,opacity;
  background:radial-gradient(circle,rgba(255,236,200,.9),transparent 70%);animation:moA linear infinite}
@keyframes moA{0%{transform:translate(0,0);opacity:0}15%{opacity:.6}80%{opacity:.3}100%{transform:translate(20px,-105vh);opacity:0}}
@keyframes moB{0%{transform:translate(0,0);opacity:0}15%{opacity:.6}80%{opacity:.3}100%{transform:translate(-20px,-105vh);opacity:0}}

#app{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
@supports (height:100svh){body,#app{min-height:100svh}}

/* ===== phong thư ===== */
#phong{grid-area:1/1;display:flex;flex-direction:column;align-items:center;cursor:pointer;outline:none;
  --ew:min(80vw,330px);transition:opacity .4s}
#phong.ready .bay{opacity:1}
.bay{position:relative;width:var(--ew);height:calc(var(--ew)*.68);opacity:0;transition:opacity .5s;animation:bay 4.2s ease-in-out infinite;will-change:transform}
@keyframes bay{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-10px) rotate(1.2deg)}}
.bongP{width:calc(var(--ew)*.72);height:16px;margin-top:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.32),transparent);
  animation:bongP 4.2s ease-in-out infinite}
@keyframes bongP{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.84);opacity:.6}}
.bay>*{position:absolute}
.bay svg{display:block;width:100%;height:100%;overflow:visible}
.pLung{inset:0;border-radius:14px;box-shadow:0 14px 30px rgba(30,10,4,.35)}
.pNapM{left:0;bottom:100%;width:100%;height:60%;transform-origin:50% 100%;transform:scaleY(0)}
.mini{left:7%;width:86%;top:7%;height:86%;border-radius:8px;background-color:#FFF8EC;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mini i{position:absolute;left:12%;right:12%;height:2px;border-radius:2px;background:rgba(91,58,46,.16)}
.pTui{inset:0}
.pNap{left:0;top:0;width:100%;height:62%;transform-origin:50% 0}
.sap{left:50%;top:62%;width:24%;aspect-ratio:1;margin:-12% 0 0 -12%;height:auto}
.guiCau{left:8%;bottom:9%;font:700 calc(var(--ew)*.085)/1 'Dancing Script',cursive;color:#5B3A2E;opacity:.85;transform:rotate(-4deg);white-space:nowrap}
#goi{margin-top:16px;font:700 14px/1.2 'Nunito',sans-serif;letter-spacing:.08em;color:#FFF1DF;opacity:.75;animation:goi 2.6s ease-in-out infinite;white-space:nowrap}
@keyframes goi{0%,100%{opacity:.45}50%{opacity:.9}}
.hieu{margin-top:10px;font:800 9.5px/1 'Nunito',sans-serif;letter-spacing:.34em;color:rgba(255,241,223,.32)}

/* ===== lá thư ===== */
:root{--tw:min(calc(100vw - 24px),430px);--th:min(calc(100vh - 24px),calc(var(--tw)*1.72))}
@supports (height:100svh){:root{--th:min(calc(100svh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)),calc(var(--tw)*1.72))}}
#thu{grid-area:1/1;position:relative;width:var(--tw);height:var(--th);border-radius:16px;visibility:hidden;
  background-color:#FFF8EC;font-size:var(--fs,16px);
  box-shadow:0 18px 40px rgba(30,10,4,.38),inset 0 0 0 1px rgba(255,255,255,.7);transform-origin:0 0}
#thu.mo{visibility:visible}
#thu::before{content:"";position:absolute;inset:7px;border:1px solid rgba(91,58,46,.2);border-radius:11px;pointer-events:none}
#thu::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:radial-gradient(120% 60% at 50% 0,rgba(255,255,255,.5),transparent 60%),radial-gradient(140% 80% at 50% 110%,rgba(214,170,120,.18),transparent 60%)}
.noi{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:.85em 1.15em .7em;overflow:hidden}
#hinh{flex:0 0 auto;height:calc(var(--ph,41) * 1%);margin:0 -.35em}
#hinh svg{width:100%;height:100%;display:block;overflow:hidden}
.chu{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.62em;padding:.2em .1em 0}
#chao{font:700 1.5em/1.12 'Dancing Script',cursive;color:var(--acc)}
#loi{font:700 1.2em/1.45 'Nunito',sans-serif;color:#46302A;text-wrap:pretty}
#loi span{display:inline-block;opacity:0}
#loi.hienTat span{opacity:1}
#xua{border-radius:10px;padding:.5em .8em .55em;background:var(--tint2);border-left:3px solid var(--acc)}
#xuaNhan{font:800 .74em/1.2 'Nunito',sans-serif;color:var(--acc);letter-spacing:.01em}
#xuaCau{font:italic 600 .93em/1.36 'Nunito',sans-serif;color:#5B3A2E;margin-top:.18em}
#xuaCau small{font:normal 700 .82em 'Nunito',sans-serif;opacity:.62;white-space:nowrap}
#ky{display:flex;justify-content:flex-end;align-items:baseline;gap:.65em;flex-wrap:wrap}
#kyTen{font:700 1.38em/1 'Dancing Script',cursive;color:var(--acc);white-space:nowrap}
#kyNgay{font:700 .74em/1 'Nunito',sans-serif;color:#9a7868;white-space:nowrap}
#mai{flex:none;text-align:center;font:700 .74em/1.2 'Nunito',sans-serif;color:#9a7868;padding-top:.35em}
.hien{opacity:0}
#thu.hienTat .hien{opacity:1}
@media (max-height:500px){
  :root{--tw:min(calc(100vw - 24px),460px)}
  #app{place-items:start center}
  #phong{margin-top:12px}
  #thu{height:auto}
  .noi{height:auto}
  #hinh{height:230px}
  .chu{flex:none}
}

/* ===== bé Cam: chỉ transform / opacity ===== */
/* chỉ các lớp chuyển động dùng fill-box (phần tử có transform="…" giữ gốc toạ độ cũ) */
.nhun,.tho,.dua,.chop,.la,.bayLen,.not,.nhap,.nhip,.tuyet,.khoi,.lua,.aura,.cong,.liec,.troi,.bong,.mohoi,.pop,.kiem,.xu,.giot,.toeL,.toeR,.giay,.zz,.lac,.tho2{transform-box:fill-box}
.nhun{animation:nhun 2.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes nhun{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-4px) scale(.985,1.015)}52%{transform:translateY(0) scale(1.03,.97)}68%{transform:translateY(0) scale(1,1)}}
.tho{animation:tho 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes tho{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
.dua{animation:dua 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes dua{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.chop{animation:chop 4.6s infinite;transform-origin:center}
@keyframes chop{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.la{animation:la 3.2s ease-in-out infinite;transform-origin:0% 100%}
@keyframes la{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.bayLen{animation:bayLen 3.2s ease-in infinite;transform-origin:center}
@keyframes bayLen{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-42px) scale(1.05);opacity:0}}
.not{animation:not 2.8s ease-out infinite;transform-origin:center}
@keyframes not{0%{transform:translate(0,0) rotate(-12deg);opacity:0}15%{opacity:1}100%{transform:translate(-20px,-36px) rotate(14deg);opacity:0}}
.nhap{animation:nhap 2.2s ease-in-out infinite;transform-origin:center}
@keyframes nhap{0%,100%{transform:scale(.45);opacity:.25}50%{transform:scale(1.1);opacity:1}}
.nhip{animation:nhip 1.1s ease-in-out infinite;transform-origin:center}
@keyframes nhip{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.tuyet{animation:tuyet linear infinite}
@keyframes tuyet{0%{transform:translate(0,0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translate(14px,205px);opacity:0}}
.khoi{animation:khoi 2.6s ease-out infinite;transform-origin:50% 100%}
@keyframes khoi{0%{transform:translateY(4px) scale(.8);opacity:0}30%{opacity:.85}100%{transform:translateY(-14px) scale(1.1);opacity:0}}
.lua{animation:lua .5s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes lua{from{transform:scale(1,1)}to{transform:scale(.82,1.16)}}
.aura{animation:aura 2.6s ease-in-out infinite;transform-origin:center}
@keyframes aura{0%,100%{transform:scale(.93);opacity:.65}50%{transform:scale(1.06);opacity:1}}
.cong{animation:cong 3s ease-out infinite}
@keyframes cong{0%{transform:translateY(10px);opacity:0}20%,75%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.liec{animation:liec 3.4s ease-in-out infinite}
@keyframes liec{0%,38%{transform:translateX(-2.6px)}50%,88%{transform:translateX(2.6px)}100%{transform:translateX(-2.6px)}}
.troi{animation:troi 5s ease-in-out infinite}
@keyframes troi{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.bong{animation:bongB 3.6s ease-in-out infinite;transform-origin:0% 50%}
@keyframes bongB{0%{transform:scale(.35);opacity:.9}70%{transform:scale(1);opacity:.9}78%{transform:scale(1.12);opacity:0}100%{transform:scale(.35);opacity:0}}
.mohoi{animation:mohoi 2.2s ease-in-out infinite}
@keyframes mohoi{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
.pop{animation:pop 2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.06)}}
.kiem{animation:kiem 1.6s ease-in-out infinite;transform-origin:0% 50%}
@keyframes kiem{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.xu{animation:xu 2.4s ease-in infinite}
@keyframes xu{0%,18%{transform:translate(0,0) scale(1);opacity:1}55%{transform:translate(44px,8px) scale(1);opacity:1}68%{transform:translate(45px,19px) scale(.6);opacity:0}86%{transform:translate(0,0) scale(.6);opacity:0}100%{transform:translate(0,0) scale(1);opacity:1}}
.giot{animation:giot 1.3s linear infinite}
@keyframes giot{0%{transform:translateY(0);opacity:0}10%{opacity:1}55%{transform:translateY(var(--d,14px));opacity:1}58%,100%{transform:translateY(var(--d,14px));opacity:0}}
.toeL,.toeR{animation:toeL 1.3s ease-out infinite}
.toeR{animation-name:toeR}
@keyframes toeL{0%,55%{transform:translate(0,0);opacity:0}60%{opacity:1}100%{transform:translate(-11px,6px);opacity:0}}
@keyframes toeR{0%,55%{transform:translate(0,0);opacity:0}60%{opacity:1}100%{transform:translate(11px,6px);opacity:0}}
.giay{animation:giayR linear infinite}
@keyframes giayR{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(70px) rotate(300deg);opacity:0}}
.zz{animation:zz 3.6s ease-out infinite}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(16px,-34px) scale(1.15);opacity:0}}
.lac{animation:lac 1.4s ease-in-out infinite;transform-origin:20% 90%}
@keyframes lac{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.tho2{animation:tho2 2s ease-in-out infinite;transform-origin:center}
@keyframes tho2{0%,100%{transform:translate(0,0);opacity:0}20%{opacity:.8}100%{transform:translate(12px,-4px);opacity:0}}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .bay,.bongP,#goi,.motes i,#hinh svg *{animation:none!important}
  .motes{display:none}
}
</style>
</head>
<body>
<div id="nen"></div>
<main id="app">
  <section id="phong" role="button" tabindex="0">
    <div class="bay" id="bay">
      <div class="pLung" id="pLung"></div>
      <div class="pNapM" id="pNapM"></div>
      <div class="mini" id="mini"><i style="top:30%"></i><i style="top:44%"></i><i style="top:58%;right:30%"></i></div>
      <div class="pTui" id="pTui"></div>
      <div class="guiCau" id="guiCau"></div>
      <div class="pNap" id="pNap"></div>
      <div class="sap" id="sap"></div>
    </div>
    <div class="bongP"></div>
    <div id="goi"></div>
    <div class="hieu">PEAKER</div>
  </section>
  <article id="thu" aria-live="polite">
    <div class="noi" id="noi">
      <div id="hinh" class="hien" role="img"></div>
      <div class="chu">
        <p id="chao" class="hien"></p>
        <p id="loi"></p>
        <figure id="xua" class="hien"><figcaption id="xuaNhan"></figcaption><blockquote id="xuaCau"></blockquote></figure>
        <div id="ky" class="hien"><span id="kyTen"></span><span id="kyNgay"></span></div>
      </div>
      <p id="mai" class="hien"></p>
    </div>
  </article>
</main>
<canvas id="fx"></canvas>
<script>
/* ================= CHỮ HIỂN THỊ — sửa ở đây ================= */
const GOI_CHAM   = 'chạm để mở thư';
const GUI_CAU    = 'Gửi cậu';
const KY_TEN     = '— PEAKER ♡';
const MAI_MO     = 'Mai mở lại, có thư mới.';
const ONG_BA     = 'Ông bà mình nói:';
const ND_VIET    = 'Nguyễn Du viết:';
const NHAC_THUONG = '../nhac/vui-tuoi.mp3', NHAC_NOEL = '../nhac/giang-sinh.mp3';

/* 12 thẻ: lời chào · 5 lá thư (đổi theo ngày) · câu xưa — chép nguyên văn loi-thu.md */
const THU=[
 {chao:'Gửi cậu, người sắp đi thi,',thu:[
  'Cậu không cần giỏi hơn ai. Chỉ cần hơn cậu của tuần trước một chút thôi.',
  'Câu dễ làm trước. Câu khó để cuối. Đọc đề hai lần. Thế là đã hơn nửa phòng rồi.',
  'Đêm trước thi: ăn no, ngủ đủ, mang dư một cây bút. Ba việc này cậu làm được 100 %.',
  'Ôn không hết cũng không sao. Đầu tỉnh táo làm bài tốt hơn đầu đầy mà buồn ngủ.',
  'Mấy đêm cậu thức, mấy trang cậu gạch… không phí đâu. Tớ thấy hết rồi.'],
  cau:'Có công mài sắt, có ngày nên kim.',nguon:'tục ngữ'},
 {chao:'Gửi cậu, người đang thích một người,',thu:[
  'Tim đập nhanh không phải bệnh đâu. Chỉ là cậu đang thích một người thôi.',
  'Hôm nay thử cười với người ta một cái. Cười thôi. Chưa cần nói gì.',
  'Người ta có đổ hay chưa, cậu vẫn đáng thích y như hôm qua.',
  'Đừng đổi mình cho vừa ý ai. Người hợp sẽ thích đúng phiên bản này của cậu.',
  'Chuyện tim cứ để nó đi chậm. Cậu còn cả thanh xuân mà.'],
  cau:'Thương nhau củ ấu cũng tròn.',nguon:'ca dao'},
 {chao:'Gửi cậu, người muốn giàu sớm,',thu:[
  'Giàu sớm không có đường tắt. Nhưng có đường đều: mỗi ngày học thêm một thứ.',
  'Tiền thường đến sau kỹ năng. Cậu cứ giỏi thật một việc trước đã.',
  'Hôm nay cho heo ăn một tờ nhỏ thôi. Heo không chê ít đâu.',
  'Đừng nhìn người đã tới đích. Cậu đang đi đúng đường của cậu.',
  'Khoản đầu tư lời nhất tuổi này: một cuốn sách, một giấc ngủ đủ, một người bạn tốt.'],
  cau:'Kiến tha lâu cũng đầy tổ.',nguon:'tục ngữ'},
 {chao:'Gửi cậu, người hôm nay cần chút may,',thu:[
  'Xui thì cũng chỉ xui một chút thôi. Cậu lì hơn nó nhiều.',
  'Gặp chuyện xui, cho phép mình than đúng 5 phút. Xong rồi đi tiếp.',
  'Chuẩn bị kỹ thêm một việc. May mắn hay ghé chỗ người đã sẵn sàng.',
  'Hôm nay có thể không may lắm. Nhưng mai là một ngày mới tinh.',
  'Tớ không hứa hôm nay may. Tớ chỉ chắc một điều: cậu không đi một mình.'],
  cau:'Sau cơn mưa trời lại sáng.',nguon:'tục ngữ'},
 {chao:'Gửi cậu, người có aura mà chưa biết,',thu:[
  'Aura không nằm trong gương. Nó nằm ở lúc cậu bước vào lớp mà không cúi đầu.',
  'Tự tin không phải là không run. Là run mà vẫn bước tới.',
  'Đứng thẳng lưng. Hít một hơi. +1000 aura đã được cộng.',
  'Cậu không cần giống ai. Bản gốc lúc nào cũng giá trị hơn bản sao.',
  'Aura thật là khi cậu tử tế, kể cả lúc không ai nhìn.'],
  cau:'Cây ngay không sợ chết đứng.',nguon:'tục ngữ'},
 {chao:'Gửi cậu, người sợ bị gọi lên bảng,',thu:[
  'Bị gọi thì cứ hít vào, nói chậm. Nói chậm thôi là đã đúng được một nửa.',
  '"Em chưa chắc ạ" cũng là một câu trả lời dũng cảm.',
  'Cả lớp ai cũng đang sợ bị gọi. Cậu không phải người duy nhất đâu.',
  'Tàng hình thì tớ chịu. Nhưng 30 giây trên bảng thì cậu chịu được.',
  'Sai trên bảng, cả lớp quên sau một tiết. Dám đứng lên, người ta nhớ lâu.'],
  cau:'Biết thì thưa thốt, không biết thì dựa cột mà nghe.',nguon:'tục ngữ'},
 {chao:'Gửi cậu, Noel này,',thu:[
  'Noel này có đôi hay chưa, cậu vẫn xứng được một cốc ca cao thật nóng.',
  'Có đôi thì đi dạo. Chưa có đôi thì đi ăn. Noel nào cũng vui.',
  'Đôi bạn cũng là đôi. Rủ đứa thân nhất đi chơi đi.',
  'Nhắn cho một người cậu nhớ. Một câu "Noel vui nha" thôi cũng được.',
  'Chúc cậu có người quàng chung khăn. Chưa có thì tớ cho mượn nửa cái.'],
  cau:'Một cây làm chẳng nên non, ba cây chụm lại nên hòn núi cao.',nguon:'ca dao'},
 {chao:'Gửi cậu, (cái này tiện tay thôi),',thu:[
  'Tiện tay mua thôi. Chỉ là… hơi nhiều lần tiện.',

const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const x=hx(a),y=hx(b);return'#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')};

const Y=dq?+dq[1]:now.getFullYear(),Mo=dq?+dq[2]-1:now.getMonth(),Da=dq?+dq[3]:now.getDate();
const doy=Math.round((Date.UTC(Y,Mo,Da)-Date.UTC(Y,0,0))/864e5);   // 1 = 1/1

function bo(o,inner){const sc=o.sy?`${o.s||1} ${o.sy}`:(o.s||1);
  return `<g transform="translate(${o.x||150} ${o.y||110}) rotate(${o.r||0}) scale(${sc})"><g class="${o.cls||'nhun'}" style="animation-delay:${o.dl||0}s">${inner}</g></g>`}

  return bo(o,inner)}

   <path d="M2 200 L132 106 M298 200 L168 106" stroke="${ln}" stroke-width="1.6" fill="none"/>
   <path d="M0 6 L136 114 Q150 124 164 114 L300 6" stroke="${rgba('#ffffff',.5)}" stroke-width="1.4" fill="none"/></svg>`;
  $('pNap').innerHTML=`<svg viewBox="0 0 300 126" preserveAspectRatio="none">
   <path d="M0 10 Q0 0 12 0 H288 Q300 0 300 10 L164 118 Q150 128 136 118Z" fill="${eL}" stroke="${ln}" stroke-width="1.4"/></svg>`;
  const sym=L.dau==='sao'?`<path d="${S4}" transform="translate(50 30) scale(1.2)" fill="${rgba('#ffffff',.85)}"/>`:L.dau==='tim'?`<path d="${HP}" transform="translate(50 31) scale(1.05)" fill="${rgba('#ffffff',.85)}"/>`:`<path d="${S4}" transform="translate(50 30) scale(1.05)" fill="${rgba('#ffffff',.85)}"/>`;
  const sp=C.sap,sD=mix(sp,'#000000',.22),sL=mix(sp,'#ffffff',.3);
  let wav='';for(let i=0;i<=24;i++){const a=i/24*Math.PI*2,r=44+(i%2?2.6:-1.4);wav+=(i?'L':'M')+(50+Math.cos(a)*r).toFixed(1)+' '+(50+Math.sin(a)*r).toFixed(1)}
  $('sap').innerHTML=`<svg viewBox="0 0 100 100"><path d="${wav}Z" fill="${sD}"/><path d="${wav}Z" transform="translate(-1.5 -2)" fill="${sp}"/>
   <circle cx="48.5" cy="48" r="31" fill="none" stroke="${sD}" stroke-width="2.6" opacity=".55"/><circle cx="48.5" cy="48" r="31" fill="none" stroke="${sL}" stroke-width="1.2" transform="translate(.8 .8)" opacity=".5"/>
   ${sym}<text x="48.5" y="69" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="21" fill="${rgba('#ffffff',.9)}">${String(so).padStart(2,'0')}</text>
   <ellipse cx="30" cy="26" rx="10" ry="5" transform="rotate(-35 30 26)" fill="#fff" opacity=".28"/></svg>`;
  $('guiCau').textContent=GUI_CAU;
  $('goi').textContent=GOI_CHAM;$('phong').setAttribute('aria-label',GUI_CAU+' — '+GOI_CHAM);
}

/* ================= lá thư ================= */
function veThu(){
  $('hinh').innerHTML=veCanh();$('hinh').setAttribute('aria-label',TA_HINH[so-1]);
  $('chao').textContent=T.chao;
  $('loi').innerHTML=T.thu[qi].replace(/ %/g,' %').split(' ').map(w=>`<span>${w}</span>`).join(' ');   // "100 %" không bị ngắt dòng
  $('xuaNhan').textContent=T.nd?ND_VIET:ONG_BA;
  $('xuaCau').innerHTML=`“${T.cau}” <small>— ${T.nguon}</small>`;
  $('kyTen').textContent=KY_TEN;$('kyNgay').textContent=NGAY;
  $('mai').textContent=MAI_MO;
  if(reduce){const sv=$('hinh').querySelector('svg');sv&&sv.pauseAnimations&&sv.pauseAnimations()}
}
/* vân giấy: vẽ 1 lần, không lọc theo khung hình */
(function(){try{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');
  for(let i=0;i<900;i++){x.fillStyle=`rgba(120,80,50,${(Math.random()*.06).toFixed(3)})`;x.fillRect(Math.random()*160,Math.random()*160,1+Math.random()*1.5,1+Math.random()*1.5)}
  for(let i=0;i<14;i++){x.strokeStyle='rgba(150,100,60,.035)';x.lineWidth=1;x.beginPath();const y=Math.random()*160;x.moveTo(0,y);x.bezierCurveTo(50,y+6,110,y-6,160,y+2);x.stroke()}
  const u='url('+c.toDataURL()+')';$('thu').style.backgroundImage=u;$('mini').style.backgroundImage=u}catch(e){}})();

/* cỡ chữ theo bề ngang thư; co lại nếu không vừa (không cuộn) */
const ngang=()=>matchMedia('(max-height:500px)').matches;
function fit(){const th=$('thu'),n=$('noi');const w=th.offsetWidth;if(!w)return;
  let k=1,ph=44;const set=()=>{th.style.setProperty('--fs',(Math.min(ngang()?18.5:99,Math.max(12,w/366*18))*k).toFixed(2)+'px');th.style.setProperty('--ph',ph)};
  set();if(ngang())return;
  let i=0;while(n.scrollHeight>n.clientHeight+1&&i++<40){if(k>.8)k-=.025;else if(ph>34)ph-=1;else if(k>.66)k-=.02;else break;set()}
}

/* hạt bay nền (CSS, ít) */
(function(){if(reduce)return;const m=document.createElement('div');m.className='motes';
  for(let i=0;i<8;i++){const e=document.createElement('i'),z=3+Math.random()*6;
    e.style.cssText=`left:${(Math.random()*100).toFixed(1)}%;width:${z.toFixed(1)}px;height:${z.toFixed(1)}px;animation-name:${i%2?'moA':'moB'};animation-duration:${(11+Math.random()*8).toFixed(1)}s;animation-delay:${(-Math.random()*16).toFixed(1)}s`;m.appendChild(e)}
  document.body.prepend(m)})();

/* ================= hạt lấp lánh (1 canvas, chỉ chạy lúc mở) ================= */
const cv=$('fx'),cx=cv.getContext('2d');let W=0,H=0,parts=[],running=false,last=0;
function size(){const D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}
size();addEventListener('resize',size);
const P_SAO=new Path2D('M0 -10 C1.2 -3 3 -1.2 10 0 C3 1.2 1.2 3 0 10 C-1.2 3 -3 1.2 -10 0 C-3 -1.2 -1.2 -3 0 -10Z');
const P_TIM=new Path2D('M0 8 C-9 2 -9.5 -5 -5 -6.5 C-2.6 -7.2 -.6 -5.6 0 -3.6 C.6 -5.6 2.6 -7.2 5 -6.5 C9.5 -5 9 2 0 8Z');
const rn=(a,b)=>a+Math.random()*(b-a);
function add(p){parts.push(p);if(!running){running=true;last=performance.now();requestAnimationFrame(loop)}}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;cx.clearRect(0,0,W,H);
  parts=parts.filter(p=>(p.t+=dt)<p.life);
  for(const p of parts){p.vx*=p.drag;p.vy=p.vy*p.drag+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const k=p.t/p.life;
    cx.globalAlpha=k<.7?1:1-(k-.7)/.3;cx.save();cx.translate(p.x,p.y);
    if(p.k==='c'){p.rot+=p.vr*dt;cx.rotate(p.rot);cx.scale(1,Math.cos(p.t*p.flip));cx.fillStyle=p.col;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
    else if(p.k==='s'){const s=p.s*(1-k*.6);cx.rotate(p.t*2);cx.scale(s/10,s/10);cx.fillStyle=p.col;cx.fill(P_SAO)}
    else if(p.k==='h'){cx.translate(Math.sin(p.t*p.w+p.ph)*p.amp,0);const s=p.s/16;cx.scale(s,s);cx.fillStyle=p.col;cx.fill(P_TIM)}
    cx.restore()}
  cx.globalAlpha=1;
  if(parts.length)requestAnimationFrame(loop);else{running=false;cx.clearRect(0,0,W,H)}}
const COLS=[C.env,mix(base,'#ffffff',.35),VANG,'#ffffff',CAM,'#FFB8C8'];
const NOELC=['#d93545','#2e8b57','#ffdc8e','#ffffff'];
function burst(x,y){if(reduce)return;const cols=noel?COLS.concat(NOELC):COLS;
  for(let i=0;i<44;i++){const a=rn(-Math.PI*.9,-Math.PI*.1),v=rn(320,820);
    add({k:'c',x:x+rn(-40,40),y:y+rn(-10,10),vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:1100,drag:.975,t:0,life:rn(1.3,2.1),w:rn(5,8),h:rn(8,13),col:cols[i%cols.length],rot:rn(0,6),vr:rn(-7,7),flip:rn(4,11)})}
  for(let i=0;i<16;i++){const a=rn(0,Math.PI*2),v=rn(120,420);add({k:'s',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,g:220,drag:.95,t:0,life:rn(.8,1.5),s:rn(7,14),col:i%3?'#fff':VANG})}
  if(!isB)for(let i=0;i<7;i++)add({k:L.dau==='tim'?'h':'s',x:x+rn(-30,30),y,vx:rn(-50,50),vy:rn(-280,-150),g:-20,drag:.99,t:0,life:rn(1.5,2.4),s:rn(12,20),w:rn(2,5),ph:rn(0,6),amp:rn(6,14),col:i%2?KEM:mix(L.bg,'#ffffff',.35)})}

/* ================= nhạc: <audio> thường (iPhone ổn), bật trong cú chạm ================= */
const isIOS=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const au=new Audio(noel?NHAC_NOEL:NHAC_THUONG);au.preload='auto';au.loop=true;au.setAttribute('playsinline','');
let nhacOn=false,nhacWant=false;
function play(){nhacWant=true;if(!isIOS)try{au.volume=0}catch(e){}
  const p=au.play();if(p&&p.then)p.then(()=>{nhacOn=true;if(!isIOS)fadeIn()}).catch(()=>{nhacOn=false});else nhacOn=true}
function fadeIn(){const t0=performance.now(),iv=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/2200);try{au.volume=k}catch(e){}if(k>=1)clearInterval(iv)},60)}
document.addEventListener('click',()=>{if(nhacWant&&au.paused)play()},true);   // máy chặn → chạm đâu cũng thử lại
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(!au.paused)au.pause()}else if(nhacWant)play()});

/* ================= mở thư ================= */
let opened=false,done=false;
const vib=p=>{if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
const later=(f,ms)=>setTimeout(f,ms);
const EZ='cubic-bezier(.2,.8,.2,1)';
function moThu(){
  if(opened)return;opened=true;play();vib([14,40,22]);
  const ph=$('phong'),th=$('thu');
  if(reduce||!th.animate){ph.style.display='none';th.classList.add('mo','hienTat');$('loi').classList.add('hienTat');done=true;return}
  $('goi').animate([{opacity:.8},{opacity:0}],{duration:250,fill:'forwards'});
  $('bay').style.animation='none';
  /* 1. dấu sáp bật ra */
  $('sap').animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.22) rotate(-8deg)',opacity:1,offset:.35},{transform:'scale(.3) translateY(-30px) rotate(30deg)',opacity:0}],{duration:420,easing:'ease-in',fill:'forwards'});
  /* 2. nắp mở */
  later(()=>{$('pNap').animate([{transform:'scaleY(1)'},{transform:'scaleY(0)'}],{duration:210,easing:'ease-in',fill:'forwards'});
    later(()=>{$('pNapM').animate([{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:230,easing:'ease-out',fill:'forwards'});vib(10)},200)},220);
  /* 3. thư trượt lên */
  later(()=>{$('mini').animate([{transform:'translateY(0)'},{transform:'translateY(-58%)'}],{duration:520,easing:'cubic-bezier(.3,.6,.3,1)',fill:'forwards'})},640);
  /* 4. thư bung ra + lấp lánh */
  later(()=>{
    const m=$('mini').getBoundingClientRect();th.classList.add('mo');fit();
    const r=th.getBoundingClientRect();
    burst(m.left+m.width/2,m.top+m.height*.3);vib(18);
    th.animate([{transform:`translate(${m.left-r.left}px,${m.top-r.top}px) scale(${m.width/r.width},${m.height/r.height})`,borderRadius:'8px'},
      {transform:'none',borderRadius:'16px'}],{duration:640,easing:EZ});
    $('mini').style.opacity=0;
    ph.animate([{transform:'none',opacity:1},{transform:'translateY(70px) scale(.92)',opacity:0}],{duration:420,easing:'ease-in',fill:'forwards'});
    later(()=>{ph.style.visibility='hidden';ph.style.pointerEvents='none'},430);
    later(hienChu,560);
  },1130);
}
function hienChu(){
  const fade=(el,dl,y=10)=>el.animate([{opacity:0,transform:`translateY(${y}px)`},{opacity:1,transform:'none'}],{duration:520,delay:dl,easing:'ease-out',fill:'forwards'});
  $('hinh').animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:620,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'forwards'});
  fade($('chao'),260);
  const sp=[...$('loi').querySelectorAll('span')];
  sp.forEach((s,i)=>s.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:420,delay:600+i*60,easing:'ease-out',fill:'forwards'}));
  const t=600+sp.length*60+150;
  fade($('xua'),t);fade($('ky'),t+260,6);fade($('mai'),t+520,4);
  later(()=>{done=true;$('thu').classList.add('hienTat');$('loi').classList.add('hienTat')},t+1100);
}
/* chạm vào hình: bé Cam nhảy + vài tim */
function choc(){if(!done||reduce)return;const r=$('hinh').getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.45;
  $('hinh').animate([{transform:'none'},{transform:'translateY(-8px) scale(1.03)'},{transform:'none'}],{duration:360,easing:'ease-out'});
  for(let i=0;i<6;i++)add({k:i%2?'h':'s',x:x+rn(-40,40),y:y+rn(-20,20),vx:rn(-60,60),vy:rn(-260,-140),g:-10,drag:.98,t:0,life:rn(1,1.6),s:rn(10,16),w:rn(2,5),ph:rn(0,6),amp:rn(4,10),col:i%2?'#FF8FB1':VANG});vib(8)}

vePhong();veThu();
let shown=false;
function show(){if(shown)return;shown=true;$('phong').classList.add('ready');fit()}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(show);setTimeout(show,1600)}else show();
addEventListener('resize',()=>{clearTimeout(fit.t);fit.t=setTimeout(fit,150)});
$('phong').addEventListener('click',moThu);
$('phong').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();moThu()}});
$('hinh').addEventListener('click',choc);
window.__peaker={so,qi,doy};   // chỉ để máy kiểm đọc
</script>
