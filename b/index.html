<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140c0a">
<title>PEAKER TAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#140c0a}
body{min-height:100vh;color:#FFF6E6;font-family:'Be Vietnam Pro',system-ui,sans-serif;overflow-x:hidden;
  background:var(--dk,#140c0a);-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#nen{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% 34%,var(--g1,#3a2418) 0,var(--dk,#140c0a) 62%),var(--dk,#140c0a)}
#nen::after{content:"";position:absolute;inset:0;background:radial-gradient(130% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.45) 100%)}
.motes{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.motes i{position:absolute;bottom:-14px;border-radius:50%;opacity:0;will-change:transform,opacity;
  background:radial-gradient(circle,var(--mo,rgba(255,226,170,.95)),transparent 70%);animation:moA linear infinite}
@keyframes moA{0%{transform:translate(0,0);opacity:0}12%{opacity:.75}80%{opacity:.4}100%{transform:translate(24px,-108vh);opacity:0}}
@keyframes moB{0%{transform:translate(0,0);opacity:0}12%{opacity:.75}80%{opacity:.4}100%{transform:translate(-22px,-108vh);opacity:0}}

#app{position:relative;z-index:2;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom));gap:clamp(18px,3.4vh,30px)}
@supports (height:100svh){body,#app{min-height:100svh}}

/* ===== lá (tỉ lệ 31:47, 1 mm in = var(--u)) ===== */
:root{--cw:clamp(168px,min(66vw,calc((100vh - 330px) * .66)),282px)}
@supports (height:100svh){:root{--cw:clamp(168px,min(66vw,calc((100svh - 330px) * .66)),282px)}}
#stage{position:relative;width:var(--cw);height:calc(var(--cw) * 47 / 31);--u:calc(var(--cw) / 31);flex:none;opacity:0;transition:opacity .5s}
#stage.ready{opacity:1}
.halo{position:absolute;left:50%;top:50%;width:190%;height:150%;margin:-75% 0 0 -95%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,var(--glA,rgba(255,220,150,.5)) 0,var(--glB,rgba(255,220,150,.16)) 52%,transparent 100%);
  animation:beat 1.9s ease-in-out infinite;will-change:transform,opacity}
@keyframes beat{0%,100%{transform:scale(.92);opacity:.72}14%{transform:scale(1.07);opacity:1}28%{transform:scale(.96);opacity:.8}42%{transform:scale(1.04);opacity:.95}70%{transform:scale(.92);opacity:.72}}
.rays{position:absolute;left:50%;top:50%;width:300%;height:calc(var(--cw)*3);margin:calc(var(--cw)*-1.5) 0 0 -150%;pointer-events:none;opacity:0;
  background:center/contain no-repeat;will-change:transform,opacity}
.rays.on{animation:spin 46s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bong{position:absolute;left:15%;width:70%;bottom:-9%;height:7%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);animation:bongb 3.8s ease-in-out infinite}
@keyframes bongb{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.82);opacity:.6}}
#bob{position:absolute;inset:0;animation:bob 3.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.1deg)}50%{transform:translateY(-11px) rotate(1.1deg)}}
#tilt{position:absolute;inset:0;cursor:pointer}
#flip{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform:perspective(900px) rotateY(180deg)}
#flip.sway{animation:swayB 5.2s ease-in-out infinite}
#flip.swayF{animation:swayF 6s ease-in-out infinite}
@keyframes swayB{0%,100%{transform:perspective(900px) rotateY(180deg) rotateX(0)}25%{transform:perspective(900px) rotateY(188deg) rotateX(3deg)}75%{transform:perspective(900px) rotateY(172deg) rotateX(-3deg)}}
@keyframes swayF{0%,100%{transform:perspective(900px) rotateY(0) rotateX(0)}25%{transform:perspective(900px) rotateY(6deg) rotateX(2deg)}75%{transform:perspective(900px) rotateY(-6deg) rotateX(-2deg)}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:#000}
.face.front{transform:rotateY(0deg) translateZ(.5px)}
.face.back{transform:rotateY(180deg) translateZ(.5px)}
.face>*{position:absolute}
.face>svg.nen{inset:0;width:100%;height:100%;overflow:visible}
.ky{top:calc(var(--u)*3.5);left:0;width:100%;text-align:center;font:700 calc(var(--u)*1.95)/1 'Be Vietnam Pro',sans-serif;letter-spacing:calc(var(--u)*.34);white-space:nowrap}
.ky svg{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);vertical-align:calc(var(--u)*-.12);margin:0 calc(var(--u)*.5) 0 calc(var(--u)*.2)}
.hinhB{left:calc(var(--u)*10.5);top:calc(var(--u)*7.3);width:calc(var(--u)*10);height:calc(var(--u)*10)}
.hinhB svg,.hinhN svg{width:100%;height:100%;display:block;overflow:visible}
.bua{top:calc(var(--u)*19.3);left:0;width:100%;display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*1.1);
  font:800 calc(var(--u)*3.5)/1 'Baloo 2',sans-serif;letter-spacing:calc(var(--u)*.9)}
.bua.sau{font-size:calc(var(--u)*2.75);letter-spacing:calc(var(--u)*.42)}
.bua i{display:block;width:calc(var(--u)*3.2);height:calc(var(--u)*.32);border-radius:9px}
.bua b{font-weight:800;margin-right:calc(var(--u)*-.9);padding-top:calc(var(--u)*.35);white-space:nowrap}
.bua.sau b{margin-right:calc(var(--u)*-.42)}
.to{top:calc(var(--u)*23.7);left:0;width:100%;text-align:center;font:800 calc(var(--u)*6.9)/.99 'Baloo 2',sans-serif;letter-spacing:calc(var(--u)*.05)}
.to span,.cau span{display:block;white-space:nowrap;width:max-content}
.to span{margin:0 auto}
.phu{left:0;width:100%;text-align:center;font:600 calc(var(--u)*2.2)/1.16 'Be Vietnam Pro',sans-serif;top:calc(var(--u)*38.7)}
.cau{top:calc(var(--u)*8.2);left:calc(var(--u)*4.3);font:700 calc(var(--u)*5.9)/1.06 'Baloo 2',sans-serif;letter-spacing:calc(var(--u)*-.04)}
.phuN{left:calc(var(--u)*4.4);top:calc(var(--u)*22);font:600 calc(var(--u)*2.2)/1.1 'Be Vietnam Pro',sans-serif;opacity:.9}
.hinhN{right:calc(var(--u)*4.2);bottom:calc(var(--u)*4.1);width:calc(var(--u)*13);height:calc(var(--u)*13)}
/* ánh bóng lướt qua mặt trước (1 lần, ngay sau khi lật) */
.shine{inset:0;pointer-events:none;overflow:hidden;
  clip-path:polygon(12.9% 0,87.1% 0,100% 8.51%,100% 91.49%,87.1% 100%,12.9% 100%,0 91.49%,0 8.51%)}
.shine i{position:absolute;top:-20%;left:-60%;width:45%;height:140%;transform:translateX(-120%) rotate(18deg);opacity:0;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55) 50%,rgba(255,255,255,0))}
/* con dấu */
.seal{right:calc(var(--u)*-4.6);bottom:calc(var(--u)*-2.6);width:calc(var(--u)*11.8);height:calc(var(--u)*11.8);opacity:0;pointer-events:none}
.seal svg{width:100%;height:100%;display:block;overflow:visible}
.seal.n{right:auto;left:calc(var(--u)*-2.2);bottom:calc(var(--u)*1.6);width:calc(var(--u)*10.5);height:calc(var(--u)*10.5)}
/* vòng gợi chạm */
.ring{position:absolute;left:50%;top:50%;width:62%;height:auto;aspect-ratio:1;margin:-31% 0 0 -31%;border-radius:50%;pointer-events:none;
  border:2px solid var(--gl,#ffe7a0);opacity:0;animation:ping 2.6s cubic-bezier(.2,.6,.3,1) infinite;will-change:transform,opacity}
.ring.r2{animation-delay:1.3s}
@keyframes ping{0%{transform:scale(.45);opacity:0}15%{opacity:.95}100%{transform:scale(1.75);opacity:0}}
#hint{position:absolute;left:0;right:0;top:calc(100% + clamp(22px,4.2vh,38px));text-align:center;font:600 14px/1.2 'Be Vietnam Pro',sans-serif;
  letter-spacing:.06em;color:var(--gl,#ffe7a0);opacity:.88;animation:hintb 2.6s ease-in-out infinite;pointer-events:none;white-space:nowrap}
@keyframes hintb{0%,100%{opacity:.5}50%{opacity:.95}}

/* ===== khung lời nhắn ===== */
#que{display:none;width:min(100%,370px);position:relative;border-radius:18px;padding:16px 18px 14px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border:1px solid var(--qb,rgba(255,231,160,.3));
  box-shadow:0 8px 24px rgba(0,0,0,.28)}
#que.show{display:block}
#que>*{opacity:0}
.qh{display:flex;align-items:center;justify-content:center;gap:8px;font:800 13.5px/1 'Baloo 2',sans-serif;letter-spacing:.16em;color:var(--gl);padding-top:2px}
.qh svg{width:9px;height:9px;flex:none}
.qh em{font-style:normal;font-weight:700;opacity:.65;letter-spacing:.08em}
.qt{margin:11px 0 9px;font:600 clamp(16px,4.6vw,19px)/1.42 'Be Vietnam Pro',sans-serif;color:#FFF6E6;text-wrap:balance}
.qt span{display:inline-block;opacity:0;transform:translateY(7px)}
.qt span.v{animation:wd .45s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes wd{to{opacity:1;transform:none}}
.hl{font:500 12px/1.3 'Be Vietnam Pro',sans-serif;color:rgba(255,246,230,.62)}
.ll{display:flex;align-items:center;gap:10px;margin:12px 2px 0;font:600 12.5px/1 'Be Vietnam Pro',sans-serif;color:rgba(255,246,230,.8)}
.ll .lb{flex:none;white-space:nowrap}
.bar{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;border-radius:8px;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--b1),var(--b2))}
.ll b{flex:none;min-width:3.1em;text-align:right;font:800 16px/1 'Baloo 2',sans-serif;color:var(--gl);font-variant-numeric:tabular-nums}
.mai{margin-top:12px;font:700 13px/1.2 'Be Vietnam Pro',sans-serif;color:var(--gl);letter-spacing:.02em}
.brand{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;font:700 9.5px/1 'Be Vietnam Pro',sans-serif;
  letter-spacing:.32em;color:rgba(255,246,230,.28);pointer-events:none}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}
#bloom{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--bx,50%) var(--by,45%),rgba(255,250,236,1) 0,var(--bl1,rgba(255,226,160,.8)) 20%,var(--bl2,rgba(255,190,90,.3)) 44%,transparent 72%)}
@media (max-height:520px){#app{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.halo,.ring,#bob,.bong,#hint,.motes i,.rays.on,#flip.sway,#flip.swayF{animation:none!important}.motes{display:none}}
</style>
</head>
<body>
<div id="nen"></div>
<main id="app">
  <div id="stage" role="button" tabindex="0">
    <div class="rays" id="rays"></div>
    <div class="halo" id="halo"></div>
    <div class="bong"></div>
    <div id="bob"><div id="tilt">
      <div id="flip"></div>
      <div class="ring"></div><div class="ring r2"></div>
    </div></div>
    <div id="hint"></div>
  </div>
  <section id="que" aria-live="polite">
    <div class="qh" id="qh"></div>
    <p class="qt" id="qt"></p>
    <div class="hl" id="hl"></div>
    <div class="ll"><span class="lb" id="lb"></span><div class="bar"><i id="barI"></i></div><b id="pct">0%</b></div>
    <div class="mai" id="mai"></div>
  </section>
  <div class="brand">PEAKER TAP</div>
</main>
<div id="bloom"></div>
<canvas id="fx"></canvas>
<script>
/* ================= CHỮ HIỂN THỊ — đổi ở đây (1 chỗ) =================
   TikTok Shop cấm chữ mê tín / bùa phép → nhãn dòng B có thể đổi (vd 'VÉ'); trang không dùng "quẻ", "linh lực"… */
const NHAN      = 'BÙA';                 // nhãn trên lá dòng B (01–07), mặt trước
const TEN_LA    = 'lá bùa';              // cách gọi tấm thẻ (chữ gợi chạm + mặt sau)
const GOI_CHAM  = 'chạm vào ' + TEN_LA;  // chữ nhỏ dưới lá lúc mới mở
const GOI_CHAM_N= 'chạm nhẹ vào thẻ';    // … dòng NÓI NHỎ (08–12)
const SAU_NHAN  = 'CHẠM ĐỂ';             // mặt sau dòng B: CHẠM ĐỂ / KÍCH HOẠT
const SAU_TO    = ['KÍCH', 'HOẠT'];
const SAU_PHU   = ['áp điện thoại', 'vào giữa ' + TEN_LA];
const SAU_N     = ['Chạm vào', 'đây nè.'];   // mặt sau dòng N
const SAU_N_PHU = '(còn điều<br>chưa nói)';
const DAU_1     = 'ĐÃ';                  // con dấu dòng B
const DAU_2     = ['KÍCH', 'HOẠT'];
const KHUNG_B   = 'LỜI NHẮN HÔM NAY';    // tiêu đề khung đổi theo ngày, dòng B
const KHUNG_N   = 'ĐIỀU CHƯA NÓI';       // … dòng N
const HIEU_LUC  = 'Hiệu lực: tới 23:59 hôm nay';
const THANH_B   = 'năng lượng';          // nhãn thanh % dòng B
const THANH_N   = 'thật lòng';           // … dòng N (luôn 100 %)
const MAI_B     = 'Mai chạm lại, lời nhắn mới.';
const MAI_N     = 'Mai chạm lại, còn nữa.';
const NHAC_THUONG = '../nhac/vui-tuoi.mp3', NHAC_NOEL = '../nhac/giang-sinh.mp3';

/* ================= 12 lá (khớp the-in-san/ve.py) + 10 lời nhắn mỗi lá ================= */
const KEM='#FFF6E6',VANG='#FFD34D';
const MAU=[
 {so:1,d:'B',chu:['QUA','MÔN'],phu:['linh hơn','nếu có học'],bg:'#FFE7A0',I:'#6B4300',A:'#E8452E',h:'bai10',q:[
  'Mở sách ra 15 phút thôi. Phần khó nhất là mở sách.',
  'Câu khó cứ để cuối. Làm câu dễ trước cho tay ấm.',
  'Hôm nay hỏi thầy cô 1 câu. Không ai chê người hỏi.',
  'Úp điện thoại xuống 20 phút. Nó không chạy mất đâu.',
  'Ngủ đủ đêm nay. Não sẽ tự xếp lại bài giùm.',
  'Chép bài đủ hôm nay. Mai đỡ phải đi mượn vở.',
  'Chỗ nào chưa hiểu, hỏi bạn bàn bên. Đừng gật bừa.',
  'Đọc lại bài cũ 5 phút trước khi ngủ. Rẻ mà hời.',
  'Học 1 bài thôi. Một bài vẫn hơn không bài nào.',
  'Viết lại công thức ra giấy. Tay nhớ lâu hơn mắt.']},
 {so:2,d:'B',chu:['CRUSH','ĐỔ'],phu:['tác dụng phụ:','cười một mình'],bg:'#FFD0DC',I:'#8E1239',A:'#F0527C',h:'tim',q:[
  'Hôm nay cười nhiều lên. Tác dụng phụ đã báo trước.',
  'Chào crush trước 1 câu. Run tay là chuyện bình thường.',
  'Hôm nay bạn trông ổn hơn bạn nghĩ. Thật đó.',
  'Đừng nhắn "ừ". Nhắn "ừ hihi". Khác nhau lắm.',
  'Đi ngang crush thì đứng thẳng lưng. Thế thôi.',
  'Crush chưa đổ thì bạn cứ đỉnh tiếp. Không thiệt gì.',
  'Hôm nay cấm đọc lại tin nhắn cũ rồi cười một mình.',
  'Tự tin là đồ trang điểm rẻ nhất. Dùng nhiều vào.',
  'Crush nhìn sang thì nhìn lại 1 giây. Rồi cười. Hết.',
  'Crush đổ hay không chưa biết. Bạn dễ thương là chắc.']},
 {so:3,d:'B',chu:['GIÀU','SỚM'],phu:['chưa giàu thì','đeo tiếp'],bg:'#CBEFD2',I:'#14573A',A:'#35B36B',h:'xu',q:[
  'Lục túi áo khoác cũ đi. Biết đâu có tiền chờ bạn.',
  'Bỏ heo 5 nghìn hôm nay. Con heo cảm ơn bạn.',
  'Trà sữa hôm nay cỡ M thôi. Phần dư là giàu sớm.',
  'Chưa giàu thì đeo tiếp. Không vội, cứ từ từ.',
  'Muốn mua gì thì chờ 1 ngày. Hết thích là đã tiết kiệm.',
  'Thử 1 ngày không tiêu đồng nào. Khó hơn bạn tưởng.',
  'Ghi lại hôm nay tiêu gì. Sẽ hơi sốc. Bình thường.',
  'Tiền lì xì còn giữ được không? Giữ tiếp. Giỏi lắm.',
  'Học thêm 1 kỹ năng. Mai sau nó tự ra tiền.',
  'Nhặt được tiền thì trả lại. Giàu nhân phẩm trước.']},
 {so:4,d:'B',chu:['NÉ','XUI'],phu:['xui thấy','tự tránh'],bg:'#CDE4FF',I:'#18427F',A:'#4A93EA',h:'o',q:[
  'Kiểm tra cặp trước khi đi. Né vụ quên vở.',
  'Sạc đầy pin trước khi ra khỏi nhà. Né xui số 1.',
  'Mang theo áo mưa. Trời mưa hay không thì kệ trời.',
  'Thấy vũng nước thì bước qua, đừng bước vào.',
  'Hôm nay đừng cãi nhau với ai. Chẳng đáng.',
  'Đi chậm qua cầu thang. Vội là hay vấp.',
  'Bài kiểm tra bất ngờ? Ôn 10 phút cho chắc.',
  'Xui nhỏ thì cười cho qua. Vẫn là một ngày ổn.',
  'Đặt báo thức sớm hơn 5 phút. Né vụ đi muộn.',
  'Nhớ mang chìa khoá. Né đứng ngoài cửa.']},
 {so:5,d:'B',chu:['+1000','AURA'],phu:['không cần','nói gì'],bg:'#E1D5FF',I:'#44248F',A:'#8B5CF6',h:'aura',q:[
  'Hôm nay nói ít lại một chút. Để người ta tò mò.',
  'Đi chậm lại 10%. Aura cộng thêm 100.',
  'Bị trêu thì cười nhẹ. Không đáp. +200 aura.',
  'Ngồi thẳng lưng. Aura cần chỗ đứng.',
  'Nói "cảm ơn" với bác bảo vệ. Aura tăng ngầm.',
  'Làm xong việc rồi mới kể. Hoặc không kể luôn.',
  'Ai làm rơi đồ, nhặt giúp. Không cần nói gì.',
  'Cả nhóm hoảng thì bạn bình tĩnh. Nhân vật chính đó.',
  'Hôm nay đừng phí năng lượng vào cãi nhau.',
  'Nhìn thẳng khi nói chuyện. Rồi mỉm cười. Hết.']},
 {so:6,d:'B',chu:['TÀNG','HÌNH'],phu:['lúc cô gọi','lên bảng'],bg:'#CFEDEA',I:'#0E5551',A:'#1FA39B',h:'tang',q:[
  'Làm bài tập rồi thì khỏi cần tàng hình.',
  'Cô dò sổ thì thở đều. Đừng nhìn trần nhà.',
  'Bị gọi lên bảng? Thì lên. Bạn làm được.',
  'Ôn bài cũ 5 phút. Bị gọi cũng thành được gọi.',
  'Đừng gãi đầu lúc cô dò sổ. Lộ lắm.',
  'Tàng hình không che được lúc nói chuyện riêng.',
  'Ngồi ngay ngắn. Người hay bị gọi là người lén lút.',

function octPts(d,c=4){const k=c+d*(2-Math.SQRT2),a=k-d,W=31,H=47;
  return [[a,d],[W-a,d],[W-d,a],[W-d,H-a],[W-a,H-d],[a,H-d],[d,H-a],[d,a]].map(p=>p[0].toFixed(3)+','+p[1].toFixed(3)).join(' ')}

$('flip').innerHTML=`<div class="face back">${isB?matB(L,true):matN(L,true)}</div>
 <div class="face front">${isB?matB(L,false):matN(L,false)}<div class="shine"><i id="shineI"></i></div><div class="seal${isB?'':' n'}" id="seal">${isB?dauB():dauN(L)}</div></div>`;
$('hint').textContent=isB?GOI_CHAM:GOI_CHAM_N;$('stage').setAttribute('aria-label',$('hint').textContent);

/* co chữ to cho vừa (như FIT của ve.py), lưu theo mm nên đổi cỡ màn hình vẫn đúng tỉ lệ */
function fit(){const u=$('stage').offsetWidth/31;if(!u)return;
  document.querySelectorAll('.fit').forEach(el=>{let mm=parseFloat(el.dataset.fs);const lim=parseFloat(el.dataset.w)*u;
    const set=()=>el.style.fontSize=`calc(var(--u)*${mm.toFixed(2)})`;set();
    const w=()=>Math.max(...[...el.children].map(s=>s.offsetWidth));
    let n=0;while(w()>lim&&mm>2&&n++<120){mm-=.05;set()}});
  document.querySelectorAll('.face').forEach(f=>{const c=f.querySelector('.cau'),p=f.querySelector('.phuN');
    if(c&&p)p.style.top=`calc(var(--u)*${((c.offsetTop+c.offsetHeight)/u+.7).toFixed(2)})`});
}
let shown=false;
function show(){if(shown)return;shown=true;fit();$('stage').classList.add('ready');if(!reduce)$('flip').classList.add('sway')}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(show);setTimeout(show,1600)}else show();
addEventListener('resize',()=>{clearTimeout(fit.t);fit.t=setTimeout(fit,150)});

/* tia sáng (vẽ sẵn 1 lần, không mask) */
(function(){try{const c=document.createElement('canvas');c.width=c.height=480;const x=c.getContext('2d'),r=240;
  x.fillStyle=rgba(mix(gl,'#ffffff',.3),.34);for(let a=0;a<360;a+=20){x.beginPath();x.moveTo(r,r);x.arc(r,r,r,a*Math.PI/180,(a+7)*Math.PI/180);x.closePath();x.fill()}
  x.globalCompositeOperation='destination-in';const g=x.createRadialGradient(r,r,r*.12,r,r,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,480,480);$('rays').style.backgroundImage='url('+c.toDataURL()+')'}catch(e){}})();

/* hạt sáng nền (CSS) */
(function(){if(reduce)return;const m=document.createElement('div');m.className='motes';
  for(let i=0;i<11;i++){const e=document.createElement('i'),z=3+Math.random()*8;
    e.style.cssText=`left:${(Math.random()*100).toFixed(1)}%;width:${z.toFixed(1)}px;height:${z.toFixed(1)}px;animation-name:${i%2?'moA':'moB'};animation-duration:${(9+Math.random()*9).toFixed(1)}s;animation-delay:${(-Math.random()*16).toFixed(1)}s`;m.appendChild(e)}
  document.body.prepend(m)})();

/* ================= hạt hiệu ứng (1 canvas) ================= */
const cv=$('fx'),cx=cv.getContext('2d');let W=0,H=0,DPR=1,parts=[],running=false,last=0;
function size(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
size();addEventListener('resize',size);
const P_SAO=new Path2D(SAO),P_TIM=new Path2D('M0 8 C-9 2 -9.5 -5 -5 -6.5 C-2.6 -7.2 -.6 -5.6 0 -3.6 C.6 -5.6 2.6 -7.2 5 -6.5 C9.5 -5 9 2 0 8Z');
const rn=(a,b)=>a+Math.random()*(b-a);
function add(p){parts.push(p);if(!running){running=true;last=performance.now();requestAnimationFrame(loop)}}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;cx.clearRect(0,0,W,H);
  parts=parts.filter(p=>(p.t+=dt)<p.life);
  for(const p of parts){p.vx*=p.drag;p.vy=p.vy*p.drag+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const k=p.t/p.life;
    cx.globalAlpha=k<.75?1:1-(k-.75)/.25;cx.save();cx.translate(p.x,p.y);
    if(p.k==='c'){p.rot+=p.vr*dt;cx.rotate(p.rot);cx.scale(1,Math.cos(p.t*p.flip));cx.fillStyle=p.col;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
    else if(p.k==='s'){const s=p.s*(1-k*.6);cx.rotate(p.t*2);cx.scale(s/10,s/10);cx.fillStyle=p.col;cx.fill(P_SAO)}
    else if(p.k==='h'){cx.translate(Math.sin(p.t*p.w+p.ph)*p.amp,0);const s=p.s/16;cx.scale(s,s);cx.fillStyle=p.col;cx.fill(P_TIM)}
    else if(p.k==='d'){cx.fillStyle=p.col;cx.beginPath();cx.arc(0,0,p.s*(1-k),0,7);cx.fill()}
    cx.restore()}
  cx.globalAlpha=1;
  if(parts.length)requestAnimationFrame(loop);else{running=false;cx.clearRect(0,0,W,H)}}
const COLS=isB?[L.bg,L.A,L.I,VANG,'#ffffff',mix(L.bg,'#ffffff',.5)]:[mix(L.bg,'#ffffff',.3),KEM,VANG,'#ffffff',mix(L.bg,'#ffffff',.6)];
const NOELC=['#d93545','#2e8b57','#ffdc8e','#ffffff'];
function burst(x,y){if(reduce)return;const cols=noel?COLS.concat(NOELC):COLS;
  for(let i=0;i<78;i++){const a=rn(-Math.PI*.92,-Math.PI*.08),v=rn(380,1000);
    add({k:'c',x:x+rn(-30,30),y:y+rn(-20,20),vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:1250,drag:.975,t:0,life:rn(1.4,2.3),w:rn(6,10),h:rn(10,16),col:cols[i%cols.length],rot:rn(0,6),vr:rn(-8,8),flip:rn(4,12)})}
  for(let i=0;i<22;i++){const a=rn(0,Math.PI*2),v=rn(140,520);add({k:'s',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,g:240,drag:.95,t:0,life:rn(.8,1.6),s:rn(8,16),col:i%3?'#fff':VANG})}
  if(!isB)hearts(x,y,10)}
function hearts(x,y,n){for(let i=0;i<n;i++)add({k:L.dau==='tim'?'h':'s',x:x+rn(-16,16),y,vx:rn(-50,50),vy:rn(-300,-150),g:-20,drag:.99,t:0,life:rn(1.6,2.6),s:rn(12,22),w:rn(2,5),ph:rn(0,6),amp:rn(6,16),col:i%2?KEM:mix(L.bg,'#ffffff',.35)})}
function ink(x,y){if(reduce)return;for(let i=0;i<16;i++){const a=rn(0,Math.PI*2),v=rn(90,260);add({k:'d',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.7,g:300,drag:.9,t:0,life:rn(.35,.7),s:rn(2,4.5),col:i%2?'#D4232E':'#fff4e0'})}
  for(let i=0;i<8;i++){const a=rn(0,Math.PI*2),v=rn(160,360);add({k:'s',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:0,drag:.9,t:0,life:rn(.4,.8),s:rn(7,12),col:VANG})}}

/* ================= nhạc: <audio> thường (iPhone ổn), bật trong cú chạm ================= */
const isIOS=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const au=new Audio(noel?NHAC_NOEL:NHAC_THUONG);au.preload='auto';au.loop=true;au.setAttribute('playsinline','');
let nhacOn=false,nhacWant=false;
function play(){nhacWant=true;if(!isIOS)try{au.volume=0}catch(e){}
  const p=au.play();if(p&&p.then)p.then(()=>{nhacOn=true;if(!isIOS)fadeIn()}).catch(()=>{nhacOn=false});else nhacOn=true}
function fadeIn(){const t0=performance.now(),iv=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/2200);try{au.volume=k}catch(e){}if(k>=1)clearInterval(iv)},60)}
document.addEventListener('click',()=>{if(nhacWant&&au.paused)play()},true);   // máy chặn → chạm đâu cũng thử lại
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(!au.paused)au.pause()}else if(nhacWant)play()});

/* ================= chạm ================= */
let opened=false;
const vib=p=>{if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
const later=(f,ms)=>setTimeout(f,ms);
function center(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function tap(){
  if(opened){poke();return}
  opened=true;play();vib([16,40,26]);
  const st=$('stage'),fl=$('flip');
  document.querySelectorAll('.ring').forEach(r=>r.remove());
  $('hint').animate?$('hint').animate([{opacity:.9},{opacity:0}],{duration:250,fill:'forwards'}):$('hint').remove();
  if(reduce){fl.style.transform='perspective(900px) rotateY(0deg)';$('seal').style.opacity=1;reveal();return}
  $('halo').animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.35)',opacity:.2},{transform:'scale(1)',opacity:.85}],{duration:900,easing:'ease-out'});
  fl.classList.remove('sway');
  const A=fl.animate([
    {transform:'perspective(900px) translateY(0) rotateY(180deg) scale(1)'},
    {transform:'perspective(900px) translateY(6px) rotateY(166deg) scale(.93)',offset:.12},
    {transform:'perspective(900px) translateY(-26px) rotateY(470deg) scale(1.14)',offset:.6},
    {transform:'perspective(900px) translateY(0) rotateY(728deg) scale(1.02)',offset:.88},
    {transform:'perspective(900px) translateY(0) rotateY(720deg) scale(1)'}],
    {duration:1250,easing:'cubic-bezier(.3,.05,.25,1)',fill:'forwards'});
  later(()=>{const p=center(st);const bl=$('bloom');bl.style.setProperty('--bx',p.x+'px');bl.style.setProperty('--by',p.y+'px');bl.style.transformOrigin=p.x+'px '+p.y+'px';
    bl.animate([{opacity:0,transform:'scale(.4)'},{opacity:.88,transform:'scale(1.15)',offset:.35},{opacity:0,transform:'scale(2.2)'}],{duration:1100,easing:'cubic-bezier(.3,.1,.3,1)'});
    $('rays').animate([{opacity:0,transform:'scale(.5) rotate(0deg)'},{opacity:1,transform:'scale(1.05) rotate(30deg)',offset:.45},{opacity:.5,transform:'scale(1) rotate(40deg)'}],{duration:1300,easing:'ease-out',fill:'forwards'})
      .onfinish=e=>{const r=$('rays');r.style.opacity=.5;r.classList.add('on');e.target.cancel()};
    burst(p.x,p.y);vib(22)},820);
  A.onfinish=()=>{A.cancel();fl.style.transform='perspective(900px) rotateY(0deg)';fl.classList.add('swayF');
    const s=$('shineI');s.animate([{transform:'translateX(-120%) rotate(18deg)',opacity:1},{transform:'translateX(420%) rotate(18deg)',opacity:1}],{duration:900,easing:'ease-in-out'});
    later(isB?stamp:seal,250)};
}
function stamp(){const s=$('seal');
  s.animate([{opacity:0,transform:'translate(-30%,-55%) scale(2.6) rotate(-34deg)'},{opacity:1,transform:'translate(0,0) scale(.94) rotate(-13deg)',offset:.62},{opacity:1,transform:'translate(0,0) scale(1.04) rotate(-13deg)',offset:.8},{opacity:1,transform:'translate(0,0) scale(1) rotate(-13deg)'}],
    {duration:330,easing:'cubic-bezier(.55,0,.8,.45)',fill:'forwards'});
  later(()=>{vib(34);ink(...Object.values(center(s)));
    $('tilt').animate([{transform:'none'},{transform:'translate(3px,4px) rotate(.8deg)'},{transform:'translate(-4px,-1px) rotate(-.9deg)'},{transform:'translate(2px,-2px) rotate(.4deg)'},{transform:'translate(-1px,1px)'},{transform:'none'}],{duration:340,easing:'ease-out'})},205);
  later(reveal,780)}
function seal(){const s=$('seal');
  s.animate([{opacity:0,transform:'scale(.2) rotate(-40deg)'},{opacity:1,transform:'scale(1.25) rotate(8deg)',offset:.55},{opacity:1,transform:'scale(.92) rotate(-4deg)',offset:.78},{opacity:1,transform:'scale(1) rotate(-8deg)'}],
    {duration:620,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
  later(()=>{vib(20);const p=center(s);hearts(p.x,p.y,9)},240);
  later(reveal,750)}
function poke(){if(reduce)return;const p=center($('stage'));hearts(p.x,p.y-30,isB?0:5);
  for(let i=0;i<10;i++){const a=rn(0,Math.PI*2),v=rn(120,320);add({k:'s',x:p.x+rn(-60,60),y:p.y+rn(-80,80),vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:120,drag:.93,t:0,life:rn(.6,1.1),s:rn(8,14),col:i%2?'#fff':VANG})}
  $('tilt').animate([{transform:'none'},{transform:'scale(.96)'},{transform:'scale(1.03)'},{transform:'none'}],{duration:380,easing:'ease-out'});vib(10)}

/* ================= khung lời nhắn ================= */
/* xuống dòng ở chỗ hết câu (không ngắt "…đã ra / đời."): gom câu vào dòng nếu vừa bề ngang */
function lines(t){const qt=$('qt'),q=$('que');q.classList.add('show');const w=qt.clientWidth-2,f=getComputedStyle(qt).font;
  const c=document.createElement('canvas').getContext('2d');c.font=f;const S=t.split(/(?<=[.?!…])\s+/),out=[];
  for(const x of S){const l=out.length?out[out.length-1]+' '+x:'';if(l&&c.measureText(l).width<=w)out[out.length-1]=l;else out.push(x)}
  return out}
function reveal(){
  const st=$('stage'),q=$('que'),y0=st.getBoundingClientRect().top;
  $('qh').innerHTML=`<svg viewBox="-10 -10 20 20"><path d="${SAO}" fill="currentColor"/></svg>${isB?KHUNG_B:KHUNG_N}<em>· ${String(Da).padStart(2,'0')}/${String(Mo+1).padStart(2,'0')}</em><svg viewBox="-10 -10 20 20"><path d="${SAO}" fill="currentColor"/></svg>`;
  $('qt').innerHTML=lines(L.q[qi]).map(l=>l.split(' ').map(w=>`<span>${w}</span>`).join(' ')).join('<br>');
  $('hl').textContent=isB?HIEU_LUC:'';$('hl').style.display=isB?'':'none';
  $('lb').textContent=isB?THANH_B:THANH_N;$('mai').textContent=isB?MAI_B:MAI_N;
  $('hint').style.display='none';q.classList.add('show');
  const kids=[...q.children];
  if(reduce||!st.animate){kids.forEach(k=>k.style.opacity=1);q.querySelectorAll('.qt span').forEach(s=>s.classList.add('v'));$('barI').style.transform=`scaleX(${PCT/100})`;$('pct').textContent=PCT+'%';return}
  const dy=y0-st.getBoundingClientRect().top;
  st.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:700,easing:'cubic-bezier(.2,.8,.2,1)'});
  q.animate([{transform:`translateY(${dy*.4+40}px)`,opacity:0},{transform:'none',opacity:1}],{duration:700,easing:'cubic-bezier(.2,.8,.2,1)'});
  kids.forEach((k,i)=>k.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:450,delay:350+i*90,easing:'ease-out',fill:'forwards'}));
  const sp=[...q.querySelectorAll('.qt span')];sp.forEach((s,i)=>{s.style.animationDelay=(.55+i*.07)+'s';s.classList.add('v')});
  const t0=550+sp.length*70+250;
  later(()=>{$('barI').animate([{transform:'scaleX(0)'},{transform:`scaleX(${PCT/100})`}],{duration:1300,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});
    const b=$('pct'),s0=performance.now();(function f(){const k=Math.min(1,(performance.now()-s0)/1300),e=1-Math.pow(1-k,3);b.textContent=Math.round(PCT*e)+'%';if(k<1)requestAnimationFrame(f);else if(PCT>=100)vib(14)})()},t0);
}
$('stage').addEventListener('click',tap);
$('stage').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}});
window.__peaker={MAU,so,qi,PCT};   // chỉ để máy kiểm đọc
</script>
